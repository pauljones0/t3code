name: rocky8-backend-release

# One-step Rocky 8.10 releases: push a tag, get tested artifacts.
#
#   git tag rocky8-v0.0.42-2 && git push fork rocky8-v0.0.42-2
#
# Tag convention: rocky8-v<VERSION>[-N], where VERSION is the t3 backend
# version (apps/server/package.json) and N disambiguates rebuilds of the same
# backend version (packaging fixes, base image refreshes, ...).
#
# What a tag run does:
#   backend job: docker build (default target = selftest, so the build itself
#     boots the server and runs the smoke test), push the runtime image to
#     GHCR, assemble the bare-metal tarball
#   desktop job: docker build the Electron AppImage (in-build selftest runs
#     the desktop smoke: natives resolve, backend boots under Electron's
#     Node, GUI opens under Xvfb), extract the AppImage
#   release job (needs both): create the GitHub release with tarball + AppImage
# A red build anywhere creates no release.
#
# Manual runs (Actions -> Run workflow) build both, upload artifacts, and skip
# the release + GHCR steps.

on:
  push:
    tags:
      - "rocky8-*"
  workflow_dispatch: {}

permissions:
  contents: write # create the tag release
  packages: write # push the backend image to GHCR

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Rocky 8.10 backend (runs in-build selftest)
        run: docker build -f packaging/rocky8/Dockerfile -t t3-rocky8:ci .

      - name: Assemble bare-metal tarball
        run: |
          set -euo pipefail
          cid="$(docker create t3-rocky8:ci)"
          mkdir -p t3dist
          docker cp "$cid:/app" t3dist/app
          docker cp "$cid:/usr/local" t3dist/node
          docker rm "$cid" >/dev/null
          tar -czf t3-rocky8-linux-x64.tar.gz -C t3dist .
          ls -la t3-rocky8-linux-x64.tar.gz
          test -f t3dist/app/dist/bin.mjs
          test -f t3dist/app/dist/client/index.html

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-tarball
          path: t3-rocky8-linux-x64.tar.gz
          if-no-files-found: error

      - name: Push image to GHCR (tag runs only)
        if: startsWith(github.ref, 'refs/tags/rocky8-')
        env:
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/pauljones0/t3code-rocky8
        run: |
          set -euo pipefail
          tag="$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')"
          # Re-tag the clean runtime stage (cached; skips the selftest layer).
          docker build -f packaging/rocky8/Dockerfile --target runtime \
            -t "$IMAGE:$tag" -t "$IMAGE:latest" .
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login "$REGISTRY" -u '${{ github.actor }}' --password-stdin
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Rocky 8.10 desktop AppImage (runs in-build selftest)
        run: docker build -f packaging/rocky8/Dockerfile.desktop -t t3desk-rocky8:ci .

      - name: Extract AppImage
        run: |
          set -euo pipefail
          cid="$(docker create t3desk-rocky8:ci)"
          mkdir -p deskdist
          docker cp "$cid:/opt/t3desk/." deskdist/
          docker rm "$cid" >/dev/null
          ls -la deskdist/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: deskdist/*.AppImage
          if-no-files-found: error

  release:
    needs: [backend, desktop]
    if: startsWith(github.ref, 'refs/tags/rocky8-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          t3ver="$(node -p "require('./apps/server/package.json').version")"
          tag='${{ github.ref_name }}'
          image="ghcr.io/pauljones0/t3code-rocky8:$(echo "$tag" | tr '[:upper:]' '[:lower:]')"
          ls -la release-assets/
          gh release create "$tag" release-assets/* \
            --title "Rocky 8.10 backend + desktop ($tag)" \
            --notes "t3 v$t3ver built and self-tested on Rocky Linux 8.10.

          Commit: ${{ github.sha }}
          Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - Backend Docker image: \`$image\` (also \`:latest\`)
            \`docker run --rm -p 3773:3773 -v t3data:/data $image\`
          - Backend tarball: \`t3-rocky8-linux-x64.tar.gz\` — the tested /app tree plus the Node 24 runtime for bare-metal Rocky 8.10 hosts.
          - Desktop AppImage: \`T3-Code-*.AppImage\` — Electron desktop for Rocky 8.10 (see host package list in packaging/rocky8/README.md).

          Both builds ran their in-image selftests (backend: CLI, natives, server boot, web client, RPC gate, sqlite; desktop: ELF sweep, backend under Electron Node, GUI window under Xvfb). Install and verify steps: \`packaging/rocky8/README.md\`."
